name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, gd, curl, openssl, phar, zip, fileinfo
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tests/run.py
      - run: python3 tests/concurrency.py
      - run: python3 tests/smtp.py
      - run: python3 tests/upgrades.py
      - run: python3 tests/recovery.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, gd, curl, openssl, phar, fileinfo
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python3 tests/browser.py
      - run: PREVIEW_BROWSER=1 python3 tests/admin-preview.py
  mariadb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, gd, curl, openssl, phar, fileinfo
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y mariadb-server mariadb-client
      - run: python3 tests/mysql.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f installer/Dockerfile -t sapiqo-check .
      - run: docker run -d --name sapiqo-check -p 127.0.0.1:8080:80 -e ADMIN_EMAIL=admin@example.org -e ADMIN_PASSWORD=Isolated-test-password-123 sapiqo-check
      - run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/login -o /tmp/login.html; then break; fi
            sleep 2
          done
          python3 tests/docker-http.py
      - if: always()
        run: docker logs sapiqo-check
      - if: always()
        run: docker rm -f sapiqo-check
