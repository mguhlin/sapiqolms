; Sapiqo — allow large course/SCORM/Common Cartridge + roster uploads.
upload_max_filesize = 1024M
post_max_size = 1056M
memory_limit = 512M
max_execution_time = 0
max_input_time = -1

; Security — PHP2Shell (CVE-2026-109619 / CVE-2026-115560): the app never uses upload-progress
; tracking, so keep it off. Mitigation only; the real fix is PHP >= 8.2.35 / 8.3.36 /
; 8.4.27 / 8.5.12 (or a distro package with the backport).
session.upload_progress.enabled = 0
