<VirtualHost *:80>
    DocumentRoot /srv/sapiqo/public
    DirectoryIndex index.php

    <Directory /srv/sapiqo/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Never expose the code/data folders even if paths are guessed.
    <DirectoryMatch "^/srv/(sapiqo/(app|bin|sql)|.*/config\.local\.php)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
