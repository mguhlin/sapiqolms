# Production Apache vhost. Copy to /etc/apache2/sites-available/sapiqo.conf,
# edit paths + ServerName, then: a2enmod rewrite headers && a2ensite sapiqo && systemctl reload apache2
<VirtualHost *:80>
    ServerName lms.example.org
    DocumentRoot /opt/courses/sapiqo/public

    <Directory /opt/courses/sapiqo/public>
        AllowOverride All          # the app ships an .htaccess front controller
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/sapiqo-error.log
    CustomLog ${APACHE_LOG_DIR}/sapiqo-access.log combined

    # For HTTPS, run certbot or terminate TLS at your proxy, then redirect 80->443.
</VirtualHost>
