# Production nginx + php-fpm. Edit root/server_name/fastcgi_pass, then reload nginx.
# Courses live OUTSIDE the docroot and are served by the app (PHP passthrough),
# so try_files simply routes everything to the front controller.
server {
    listen 80;
    server_name lms.example.org;
    root /opt/courses/sapiqo/public;
    index index.php;
    client_max_body_size 256M;              # allow large course/SCORM uploads

    location ^~ /courses/ { rewrite ^ /index.php last; }

    location / { try_files $uri $uri/ /index.php$is_args$args; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # match your PHP-FPM socket
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
